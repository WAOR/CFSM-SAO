<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      纯静态部署（GitHub Pages 等）时把后端地址填进来，多个用英文逗号分隔；
      由 Worker 托管时留空即可，前端会用同源地址。
      `npm run build:github-page` 会用 .env 里的 API_BASE 自动写入这里。
    -->
    <meta name="apiBase" content="" />
    <meta
      name="keywords"
      content="CFSM-Theme-SAO, CF-Server-Monitor, SAO, server monitor, real-time server status, server performance dashboard" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CFSM-Theme-SAO" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.ico" />
    <meta property="og:title" content="CFSM-Theme-SAO" />
    <meta property="og:description" content="A restrained modern theme for CF-Server-Monitor." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CFSM-Theme-SAO" />
    <meta name="twitter:description" content="A restrained modern theme for CF-Server-Monitor." />
    <title>CF-Server-Monitor</title>
    <meta name="description" content="A restrained modern theme for CF-Server-Monitor." />
    <script>
      (() => {
        // 超前核心 API 预加载：利用浏览器解析 HTML 与下载 React Bundle 的网络空档期，提前并发拉取关键数据
        try {
          if (typeof window !== "undefined" && typeof fetch === "function") {
            const getMeta = (name) => {
              const el = document.querySelector(`meta[name="${name}"]`);
              return el ? (el.content || "").trim() : "";
            };
            const stripTrailing = (s) => (s || "").replace(/\/+$/, "");
            const normalizeBase = (val) => {
              const raw = stripTrailing(val);
              if (!raw) return "";
              try {
                return stripTrailing(new URL(raw, window.location.href).origin);
              } catch {
                return "";
              }
            };
            const rawBases = getMeta("apiBase");
            let bases = [];
            if (rawBases) {
              bases = rawBases.split(",").map(normalizeBase).filter(Boolean);
            }
            if (bases.length === 0) {
              bases = [stripTrailing(window.location.origin)];
            }
            bases = Array.from(new Set(bases));

            const getStorage = (k) => {
              try { return localStorage.getItem(k) || ""; } catch { return ""; }
            };
            const headers = { Accept: "application/json" };
            const jwt = getStorage("jwt_token");
            if (jwt) headers["Authorization"] = "Bearer " + jwt;
            const turnstileVerified = getStorage("turnstile_verified");
            if (turnstileVerified) {
              headers["X-Turnstile-Verified"] = turnstileVerified;
            } else {
              const turnstileToken = getStorage("turnstile_token");
              if (turnstileToken) headers["X-Turnstile-Token"] = turnstileToken;
            }

            const primaryBase = bases[0] || "";
            // 预取主站 /api/config
            const configPromise = fetch(primaryBase + "/api/config", {
              credentials: "include",
              headers,
            }).then(r => r.ok ? r.json() : null).catch(() => null);

            // 预取各站 /api/servers
            const serversPromises = bases.map(base => ({
              base,
              promise: fetch(base + "/api/servers", {
                credentials: "include",
                headers,
              }).then(async r => {
                if (!r.ok) return { base, error: new Error(`HTTP ${r.status}`) };
                const data = await r.json();
                return { base, data };
              }).catch(err => ({ base, error: err })),
            }));

            window.__EARLY_DATA__ = {
              config: configPromise,
              servers: serversPromises,
            };
          }
        } catch {}

        try {
          const cachedTitle = localStorage.getItem("komaritheme:sitename");
          if (cachedTitle && cachedTitle.trim()) {
            document.title = cachedTitle.trim();
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="apple-mobile-web-app-title"]', cachedTitle.trim());
            setMeta('meta[property="og:title"]', cachedTitle.trim());
            setMeta('meta[name="twitter:title"]', cachedTitle.trim());
          }
          const cachedDesc = localStorage.getItem("komaritheme:description");
          if (cachedDesc && cachedDesc.trim()) {
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="description"]', cachedDesc.trim());
            setMeta('meta[property="og:description"]', cachedDesc.trim());
            setMeta('meta[name="twitter:description"]', cachedDesc.trim());
          }
        } catch {}
        const appearances = new Set(["system", "light", "dark"]);
        const readAppearance = (key) => {
          const raw = localStorage.getItem(key);
          if (raw == null) return null;
          let value = raw;
          try {
            value = JSON.parse(raw);
          } catch {}
          if (!appearances.has(value)) return null;
          const normalized = JSON.stringify(value);
          if (raw !== normalized) localStorage.setItem(key, normalized);
          return value;
        };

        let appearance = "system";
        try {
          appearance = readAppearance("appearance") ?? readAppearance("appearance_default") ?? "system";
        } catch {
          appearance = "system";
        }
        const resolved =
          appearance === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        document.documentElement.dataset.appearance = resolved;
        document.documentElement.style.colorScheme = resolved;
        const isDark = resolved === "dark";
        const color = isDark ? "#09090b" : "#f4f5f7";
        document.documentElement.style.backgroundColor = color;
        const metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach((el) => el.remove());
        const meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = color;
        document.head.appendChild(meta);
        const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) {
          statusMeta.content = isDark ? "black-translucent" : "default";
        }

        try {
          const rawDepth = localStorage.getItem("komaritheme:dark-depth");
          if (rawDepth != null) {
            const parsedDepth = Number(rawDepth);
            const darkDepth = Number.isFinite(parsedDepth)
              ? Math.min(100, Math.max(0, Math.round(parsedDepth)))
              : 0;
            if (darkDepth > 0) {
              document.documentElement.style.setProperty(
                "--dark-depth",
                String(darkDepth),
              );
            } else {
              document.documentElement.style.removeProperty("--dark-depth");
            }
          }
        } catch {}

        try {
          const rawBg = localStorage.getItem("komaritheme:bg");
          if (rawBg) {
            const bg = JSON.parse(rawBg);
            if (bg && (bg.v === 1 || bg.v === 2)) {
              const sizes = new Set(["cover", "contain", "auto"]);
              const positions = new Set(["top", "center", "bottom"]);
              const parseImage = (value) =>
                typeof value === "string" &&
                (value === "none" || /^url\("[^\"'`()<>\\\s]+"\)$/.test(value))
                  ? value
                  : null;
              const dark = resolved === "dark";
              const desktopImage =
                parseImage(dark ? bg.darkDesktop : bg.lightDesktop) ?? "none";
              const mobile =
                parseImage(dark ? bg.darkMobile : bg.lightMobile) ?? desktopImage;
              const isMobile = window.matchMedia("(max-width: 720px)").matches;
              const hasCoarsePointer = window.matchMedia(
                "(hover: none) and (pointer: coarse)",
              ).matches;
              const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)",
              ).matches;
              const saveData = navigator.connection && navigator.connection.saveData === true;
              const shouldLoadDesktopVideo =
                bg.v === 2 &&
                bg.desktopVideo === true &&
                !isMobile &&
                !hasCoarsePointer &&
                !reducedMotion &&
                !saveData;
              const desktop = shouldLoadDesktopVideo ? "none" : desktopImage;
              const parsedAlpha =
                (typeof bg.alpha === "string" && bg.alpha.trim() !== "") ||
                typeof bg.alpha === "number"
                  ? Number(bg.alpha)
                  : Number.NaN;
              const alpha = Number.isFinite(parsedAlpha)
                ? Math.min(100, Math.max(0, Math.round(parsedAlpha)))
                : 100;
              const scrim = alpha >= 95 ? 0 : Math.round(((95 - alpha) / 95) * 16);
              const style = document.documentElement.style;
              style.setProperty("--bg-image-desktop", desktop);
              style.setProperty("--bg-image-mobile", mobile);
              style.setProperty("--bg-size", sizes.has(bg.size) ? bg.size : "cover");
              style.setProperty("--bg-position", positions.has(bg.position) ? bg.position : "center");
              const selectedImage = isMobile ? mobile : desktop;
              if (selectedImage !== "none") {
                style.setProperty("--surface-alpha", String(alpha));
              } else {
                style.removeProperty("--surface-alpha");
              }
              if (selectedImage !== "none" && scrim > 0) {
                style.setProperty(
                  "--bg-scrim",
                  `color-mix(in srgb, var(--bg-0) ${scrim}%, transparent)`,
                );
              } else {
                style.removeProperty("--bg-scrim");
              }
            }
          }
        } catch {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CgMb3FIX.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-Cyuzqnbw.js">
    <link rel="modulepreload" crossorigin href="./assets/charts-lRTmaCY8.js">
    <link rel="modulepreload" crossorigin href="./assets/react-CfATAyk4.js">
    <link rel="modulepreload" crossorigin href="./assets/query-B2KnTXgC.js">
    <link rel="modulepreload" crossorigin href="./assets/validation-FBnilo1y.js">
    <link rel="stylesheet" crossorigin href="./assets/charts-CnsZ1jie.css">
    <link rel="stylesheet" crossorigin href="./assets/index-C-LildUv.css">
    <meta name="theme-version" content="SAO v1.0.0" />
  </head>
  <body>
    <div id="root" class="relative z-30"></div>
  </body>
</html>
